<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header class="navbar">
    <div >ReflectLearn</div>

    <nav >
        <a href="index.html">Home</a> &nbsp;&nbsp;
        <a href="about.html">About</a> &nbsp; &nbsp;
        <a href="features.html">Features</a> &nbsp; &nbsp;
        <a href="login.html" class="nav-btn">Login</a> &nbsp; &nbsp;
    </nav>
</header>

<section class="form-contain">
    <div class="login-box">
        <h2>Create Account</h2>
        <p>Start your learning journey</p>

        <form class="login-form" >
            <input id="name" type="text" placeholder="Full Name" required><br><br>
            <input id="email" type="email" placeholder="Email Address" required><br> <br>
            <input id="password" type="password" placeholder="Password" required> <br> <br>
            <input id ="cpassword" type="password" placeholder="Confirm Password" required><br><br>

            <button id ="signup" type="submit">Sign Up</button><br> <br>
        </form>

        <div class="login-links">
            <span>Already have an account?</span>
            <a href="login.html">Login</a>
        </div>
    </div>
</section>
<script src="loginjava.js"></script>
</body>
</html>
